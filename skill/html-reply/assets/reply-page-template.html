<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HTML 回复</title>
  <style>
    :root{--outer:#ded3b8;--paper:#ece3cd;--panel:#efe8d6;--ink:#4f4a3c;--muted:#6b6455;--hair:#d8d2c4;--accent:#d9a441;--gray:#6f6a60;--on-ink:#e9dec4}
    *{box-sizing:border-box}html,body{margin:0}body{background:var(--outer);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:19px;line-height:1.65;-webkit-font-smoothing:antialiased}
    .page{width:calc(100% - 32px);margin:20px auto 48px;border-right:1.5px solid var(--ink);border-left:1.5px solid var(--ink);background:var(--paper)}
    .head{padding:46px clamp(28px,4vw,56px) 40px;border-bottom:2px solid var(--ink)}
    .eyebrow{font-size:16px;font-weight:800;letter-spacing:.13em;color:var(--muted);text-transform:uppercase}h1{margin:14px 0 10px;font-size:clamp(40px,5vw,66px);font-weight:900;line-height:1.02;letter-spacing:-.025em}.sub{margin:0;color:var(--muted);font-size:19px}
    .layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:36px;padding:36px clamp(28px,4vw,56px);border-bottom:2px solid var(--ink)}.toc{position:sticky;top:20px;align-self:start;padding:16px;border:1.5px solid var(--ink);border-radius:5px;background:var(--panel)}.toc b{display:block;margin-bottom:10px;font-size:16px;letter-spacing:.1em}.toc a{display:block;padding:6px 3px;color:var(--muted);font-size:16px;font-weight:750;text-decoration:none}.reading{min-width:0}.answer{margin:0 0 28px;padding:18px 20px;border:1.5px solid var(--ink);border-left:9px solid var(--accent);border-radius:5px;background:var(--panel);font-size:21px;font-weight:800}.line{margin:0 0 14px}h2{margin:38px 0 16px;padding-bottom:9px;border-bottom:1.5px solid var(--ink);font-size:29px}.uses{display:grid;gap:12px}.use{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:24px;padding:16px 18px;border:1.5px solid var(--ink);border-radius:5px;background:var(--panel)}.use:nth-child(even){background:var(--paper)}.use b{white-space:nowrap;font-size:20px}.use p{margin:0}.source{color:var(--muted);font-size:16px}
    @media(max-width:900px){.layout{display:block;padding:28px 20px}.toc{position:static;margin-bottom:28px}.use{grid-template-columns:1fr;gap:6px}.use b{white-space:normal}}@media(max-width:700px){.page{width:calc(100% - 20px);margin:10px auto 28px}.head{padding:32px 20px}}@media print{body{background:var(--paper)}.toc{display:none}.page{width:100%;margin:0;border:0}.layout{display:block}}
  </style>
</head>
<body>
  <main class="page">
    <header class="head"><div class="eyebrow">HTML REPLY</div><h1>当前回复主题</h1><p class="sub">一句话说明这次回复解决了什么。</p></header>
    <div class="layout">
      <nav class="toc"><b>目录</b><a href="#answer">直接答案</a><a href="#detail">具体解释</a></nav>
      <article>
        <section class="reading" id="answer"><p class="answer">先给出直接、简洁、可以独立理解的答案。</p></section>
        <h2 id="detail">具体解释</h2>
        <div class="uses">
          <section class="use"><b>概念 A</b><p>用一句完整的话解释。</p></section>
          <section class="use"><b>概念 B</b><p>说明关键区别或联系。</p></section>
        </div>
        <p class="source">依据或交付文件：仅在当前回复需要时显示。</p>
      </article>
    </div>
  </main>
</body>
</html>
