<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>__HTML_REPLY_TITLE__</title>
  <style>
    :root{--outer:#ded3b8;--paper:#ece3cd;--panel:#efe8d6;--ink:#4f4a3c;--muted:#6b6455;--muted2:#8a8271;--line:#4f4a3c;--hair:#d8d2c4;--accent:#d9a441;--gray:#6f6a60;--gray2:#b3a988;--on-ink:#e9dec4;--track:#e2dcce;--blue:#d8d2c4;--green:#e2dcce;--purple:#e7dfd1}
    *{box-sizing:border-box}
    html,body{margin:0}
    body{background:var(--outer);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:19px;line-height:1.65;-webkit-font-smoothing:antialiased}
    ::selection{background:var(--accent);color:var(--ink)}
    .reply-page{width:calc(100% - 32px);margin:20px auto 48px;border-right:1.5px solid var(--line);border-left:1.5px solid var(--line);background:var(--paper)}
    .reply-page>header,.reply-page>section,.reply-page>article{margin:0;padding:36px clamp(28px,4vw,56px);border:0;border-bottom:2px solid var(--line);background:transparent}
    .reply-page>header{padding-top:46px;padding-bottom:40px}
    h1{margin:0;font-size:clamp(40px,5vw,66px);font-weight:900;line-height:1.02;letter-spacing:-.025em}
    h2{margin:0 0 18px;padding-bottom:10px;border-bottom:1.5px solid var(--line);font-size:30px;font-weight:850;line-height:1.22}
    h3{margin:0 0 9px;font-size:23px;line-height:1.3}
    p{margin:8px 0 14px}
    .eyebrow,.kicker,.section-label,.section-no{color:var(--muted);font-size:16px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    .section-no{color:var(--accent);font-variant-numeric:tabular-nums}
    [data-html-reply-summary],.answer{padding:18px 20px;border:1.5px solid var(--line);border-left:9px solid var(--accent);border-radius:5px;background:var(--panel);font-size:21px;font-weight:800}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
    .card,.panel,.callout,.metric,.file{padding:18px 20px;border:1.5px solid var(--line);border-radius:5px;background:var(--panel)}
    .card:nth-child(even),.panel:nth-child(even){background:var(--paper)}
    .chip,.badge{display:inline-flex;align-items:center;max-width:100%;padding:4px 10px;border:1.5px solid var(--line);border-radius:5px;background:var(--ink);color:var(--on-ink);font-size:16px;font-weight:800;line-height:1.2}
    .chip.accent,.badge.accent{background:var(--accent);color:var(--ink)}
    table{width:100%;border-collapse:collapse;background:var(--panel)}
    th,td{padding:13px 15px;border:1.5px solid var(--line);text-align:left;vertical-align:top}
    th{background:var(--paper);font-weight:800}
    a{color:var(--ink);text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
    code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    :not(pre)>code{padding:.08em .35em;border-radius:3px;background:var(--panel)}
    .reply-page pre code{background:transparent;color:inherit;padding:0;border-radius:0}
    ul,ol{padding-left:25px}
    li{margin:7px 0}
    small,.caption,figcaption,.source,.meta{color:var(--muted);font-size:16px;line-height:1.55}
    @media(max-width:700px){.reply-page{width:calc(100% - 20px);margin:10px auto 28px}.reply-page>header,.reply-page>section,.reply-page>article{padding:26px 20px}h1{font-size:clamp(36px,11vw,52px)}h2{font-size:27px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="reply-page">
__HTML_REPLY_FRAGMENT__
  </main>
</body>
</html>
