<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>__HTML_REPLY_TITLE__</title>
  <style>
    :root{--paper:#faf9f5;--paper2:#efe8d6;--ink:#4f4a3c;--muted:#766f60;--line:#4f4a3c;--accent:#d9a441;--blue:#dce9f4;--green:#dcebd9;--purple:#e9e0ef}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:19px;line-height:1.65}.reply-page{width:calc(100% - 56px);margin:28px auto 52px}.reply-page>header,.reply-page>section,.reply-page>article{margin-top:20px;padding:28px 32px;border:2px solid var(--line);background:#fff}.reply-page>header{margin-top:0;padding:42px 44px;border-left:12px solid var(--accent);background:var(--paper2)}h1{margin:0;font-size:clamp(40px,5vw,68px);line-height:1.08}h2{margin:0 0 16px;font-size:30px;line-height:1.25}h3{margin:0 0 9px;font-size:23px}p{margin:8px 0 14px}[data-html-reply-summary],.answer{padding:20px 22px;border:2px solid var(--line);border-left:10px solid var(--accent);background:var(--paper2);font-size:21px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card,.panel,.callout{padding:20px;border:2px solid var(--line);background:var(--blue)}.card:nth-child(even),.panel:nth-child(even){background:var(--green)}table{width:100%;border-collapse:collapse}th,td{padding:14px 15px;border:1.5px solid var(--line);text-align:left;vertical-align:top}th{background:var(--paper2)}code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.reply-page pre code{background:transparent;color:inherit;padding:0;border-radius:0}ul,ol{padding-left:25px}li{margin:7px 0}@media(max-width:700px){.reply-page{width:calc(100% - 24px);margin:12px auto 32px}.reply-page>header,.reply-page>section,.reply-page>article{padding:24px 20px}}
  </style>
</head>
<body>
  <main class="reply-page">
__HTML_REPLY_FRAGMENT__
  </main>
</body>
</html>
