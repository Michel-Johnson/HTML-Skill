name: test

on:
  push:
  pull_request:

jobs:
  install-and-hooks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile install.py skill/html-reply/scripts/prompt_hook.py skill/html-reply/scripts/reply_history.py skill/html-reply/scripts/stop_hook.py
